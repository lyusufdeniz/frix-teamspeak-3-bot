name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s/Include=\"FrixVersion\" Value=\"[^\"]*\"/Include=\"FrixVersion\" Value=\"$v\"/" TS3AudioBot/TS3AudioBot.csproj
      - name: Package
        shell: bash
        run: bash packaging/package.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: Frix-${{ matrix.rid }}
          path: dist/Frix-${{ matrix.rid }}.zip

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          sed -i "s/Include=\"FrixVersion\" Value=\"[^\"]*\"/Include=\"FrixVersion\" Value=\"$v\"/" TS3AudioBot/TS3AudioBot.csproj
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/frix:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/frix:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Frix TeamSpeak music and server bot
            org.opencontainers.image.licenses=OSL-3.0
