name: Pages

on:
  push:
    branches: [ main ]
    paths: [ "site/**", "docs/images/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/screens _site/fonts
          cp -r site/. _site/
          cp docs/images/screens/*.png _site/screens/
          cp docs/images/logo.svg docs/images/banner.png docs/images/favicon.ico _site/
          cp FrixPanel/assets/fonts/JetBrainsMono-Regular.ttf FrixPanel/assets/fonts/JetBrainsMono-Bold.ttf _site/fonts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
