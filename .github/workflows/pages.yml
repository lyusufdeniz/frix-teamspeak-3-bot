name: Pages

on:
  push:
    branches: [ main ]
    paths: [ "site-redirect/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the website moved to https://frix-teamspeak.github.io/ (repo frix-teamspeak/frix-teamspeak.github.io);
      # this address only redirects there
      - name: Redirect page
        run: mkdir -p _site && cp site-redirect/index.html site-redirect/404.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
