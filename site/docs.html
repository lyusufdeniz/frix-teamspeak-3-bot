<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frix Docs — TeamSpeak bot documentation</title>
<meta name="description" content="Documentation of Frix TeamSpeak Bot: installation, web panel, plugins and their settings, chat commands, texts, scripts, administration and troubleshooting.">
<meta property="og:title" content="Frix Docs">
<meta property="og:image" content="https://frix-teamspeak.github.io/banner.png">
<meta name="theme-color" content="#1b1c20">
<link rel="icon" href="favicon.ico">
<style>
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
  :root {
    --bg: #17181b; --bg2: #1d1e22; --surface: #222328; --raised: #2a2b31; --line: #33343b; --line2: #42434b;
    --text: #ecedf1; --muted: #9a9ba5; --accent: #5b8def; --accent-2: #8fb0f5; --fox: #ec6b2d;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 var(--ui); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header.nav { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .nav .in { display: flex; align-items: center; gap: 22px; height: 64px; max-width: 1440px; margin: 0 auto; padding: 0 24px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); font: 700 1.35rem var(--mono); letter-spacing: -.02em; }
  .brand:hover { text-decoration: none; }
  .brand img { width: 34px; height: 34px; }
  .brand small { display: block; font: 400 .7rem var(--mono); color: var(--muted); margin-top: -3px; }
  .docs-badge { font: 700 .72rem var(--mono); color: var(--accent-2); background: rgba(91,141,239,.13); border: 1px solid rgba(91,141,239,.3); padding: 2px 8px; border-radius: 999px; }
  .nav nav { display: flex; gap: 18px; margin-left: auto; }
  .nav nav a { color: var(--muted); font-size: .93rem; }
  .nav nav a:hover { color: var(--text); text-decoration: none; }
  .lang { display: flex; border: 1px solid var(--line2); border-radius: 999px; overflow: hidden; }
  .lang button { background: none; border: 0; color: var(--muted); font: 600 .78rem var(--ui); padding: 6px 11px; cursor: pointer; }
  .lang button.on { background: var(--raised); color: var(--text); }

  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr) 220px; gap: 44px; max-width: 1440px; margin: 0 auto; padding: 0 24px; }

  /* left sidebar: search + grouped page list */
  .side { position: sticky; top: 64px; align-self: start; height: calc(100vh - 64px); overflow-y: auto; padding: 26px 8px 40px 0;
    border-right: 1px solid var(--line); scrollbar-width: thin; }
  .search { position: relative; margin: 0 12px 18px 0; }
  .search input { width: 100%; background: var(--surface); border: 1px solid var(--line2); color: var(--text); border-radius: 9px;
    padding: 8px 12px 8px 34px; font: 500 .88rem var(--ui); outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
  .search kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 600 .68rem var(--mono); color: var(--muted);
    border: 1px solid var(--line2); border-radius: 5px; padding: 0 5px; }
  .grp { margin-bottom: 18px; }
  .grp h5 { margin: 0 0 6px; padding-left: 12px; font: 700 .7rem var(--mono); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .side a.pg { display: block; padding: 6px 12px; margin-right: 12px; border-radius: 7px; color: #c3c5cd; font-size: .92rem; }
  .side a.pg:hover { background: rgba(255,255,255,.04); color: var(--text); text-decoration: none; }
  .side a.pg.on { background: rgba(91,141,239,.14); color: var(--accent-2); font-weight: 600; }
  .side .sub { margin: 2px 12px 6px 18px; border-left: 1px solid var(--line); }
  .side .sub a { display: block; padding: 3px 10px; font-size: .84rem; color: var(--muted); }
  .side .sub a:hover { color: var(--text); text-decoration: none; }
  .side .sub a.on { color: var(--text); }
  .side .foot { border-top: 1px solid var(--line); margin: 6px 12px 0 0; padding-top: 14px; display: grid; gap: 6px; font-size: .84rem; }
  .side .foot a { color: var(--muted); }
  .side .foot a:hover { color: var(--text); }

  /* search results */
  .results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30; background: #1f2025; border: 1px solid var(--line2);
    border-radius: 12px; box-shadow: 0 18px 44px rgba(0,0,0,.5); padding: 6px; max-height: 60vh; overflow: auto; }
  .results[hidden] { display: none; }
  .results a { display: block; padding: 8px 10px; border-radius: 8px; color: var(--text); font-size: .88rem; }
  .results a:hover, .results a.sel { background: rgba(91,141,239,.14); text-decoration: none; }
  .results a small { display: block; color: var(--muted); font-size: .76rem; }
  .results mark { background: rgba(91,141,239,.35); color: inherit; border-radius: 3px; }
  .results .none { padding: 10px; color: var(--muted); font-size: .86rem; }

  /* mobile: menu button + drawer */
  .menu-btn { display: none; background: none; border: 1px solid var(--line2); color: var(--text); border-radius: 9px; padding: 6px 9px; cursor: pointer; }
  .menu-btn svg { width: 18px; height: 18px; display: block; }
  .shade { display: none; }

  /* article */
  article { padding: 34px 0 80px; min-width: 0; }
  .edit { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); font-size: .86rem; }
  .edit a { color: var(--muted); }
  .edit a:hover { color: var(--text); }
  .crumb { color: var(--muted); font: 600 .78rem var(--mono); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
  article h1 { font-size: 2.3rem; letter-spacing: -.02em; line-height: 1.15; margin: 0 0 18px; }
  article h2 { font-size: 1.5rem; letter-spacing: -.01em; margin: 46px 0 12px; padding-top: 14px; border-top: 1px solid var(--line); scroll-margin-top: 80px; }
  article h3 { font-size: 1.12rem; margin: 30px 0 8px; scroll-margin-top: 80px; }
  article p, article li { color: #d3d5dc; }
  article strong { color: var(--text); }
  article em { color: var(--muted); }
  article code { font-family: var(--mono); font-size: .84em; background: var(--raised); color: #e6e8ee; padding: 1px 6px; border-radius: 5px; }
  article pre { position: relative; background: #121316; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; }
  article pre code { background: none; padding: 0; font-size: .85rem; line-height: 1.6; color: #d7dbe5; }
  .copy { position: absolute; top: 8px; right: 8px; background: var(--raised); border: 1px solid var(--line2); color: var(--muted); border-radius: 7px; padding: 3px 9px; font: 600 .72rem var(--ui); cursor: pointer; }
  .copy:hover { color: var(--text); }
  article table { width: 100%; border-collapse: collapse; margin: 14px 0 20px; font-size: .9rem; display: block; overflow-x: auto; }
  article th, article td { border: 1px solid var(--line); padding: 8px 11px; text-align: left; vertical-align: top; }
  article th { background: var(--surface); color: var(--text); font-weight: 700; white-space: nowrap; }
  article td { color: #cfd2da; }
  article tr:nth-child(even) td { background: rgba(255,255,255,.015); }
  article blockquote { margin: 16px 0; padding: 10px 16px; border-left: 3px solid var(--accent); background: rgba(91,141,239,.08); border-radius: 0 8px 8px 0; }
  article blockquote p { margin: 0; }
  article hr { border: 0; border-top: 1px solid var(--line); margin: 30px 0; }
  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
  .pager a { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line2); border-radius: 12px; padding: 14px 18px; color: var(--text); background: var(--surface); }
  .pager a:hover { border-color: var(--accent); text-decoration: none; }
  .pager a span { color: var(--muted); font-size: .8rem; }
  .pager a.next { text-align: right; grid-column: 2; }
  .loading { color: var(--muted); padding: 40px 0; }

  /* on this page */
  .toc { position: sticky; top: 64px; align-self: start; padding: 34px 0; max-height: calc(100vh - 64px); overflow: auto; font-size: .85rem; }
  .toc h4 { margin: 0 0 10px; font: 700 .72rem var(--mono); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .toc a { display: block; color: var(--muted); padding: 4px 0 4px 12px; border-left: 2px solid var(--line); }
  .toc a.on { color: var(--text); border-left-color: var(--accent); }
  .toc a:hover { color: var(--text); text-decoration: none; }

  @media (max-width: 1200px) { .layout { grid-template-columns: 240px minmax(0, 1fr); } .toc { display: none; } }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .menu-btn { display: block; }
    .side { position: fixed; top: 64px; left: 0; bottom: 0; height: auto; width: min(300px, 86vw); z-index: 25; background: var(--bg2);
      padding: 20px 8px 40px 16px; transform: translateX(-102%); transition: transform .2s ease; }
    body.open .side { transform: none; }
    body.open .shade { display: block; position: fixed; inset: 64px 0 0; background: rgba(0,0,0,.5); z-index: 24; }
    .results { width: auto; }
    .search kbd { display: none; }
  }
  @media (max-width: 700px) {
    .nav nav { display: none; }
    .nav .in { gap: 12px; }
    article h1 { font-size: 1.8rem; }
    .pager { grid-template-columns: 1fr; }
    .pager a.next { grid-column: 1; }
  }
</style>
</head>
<body>
<header class="nav">
  <div class="in">
    <button type="button" class="menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="brand" href="./"><img src="logo.svg" alt=""><span>frix<small>teamspeak bot</small></span></a>
    <span class="docs-badge">DOCS</span>
    <nav>
      <a href="./" data-t="nav.home">Home</a>
      <a href="https://github.com/lyusufdeniz/frix-teamspeak-bot/releases/latest" data-t="nav.download">Download</a>
      <a href="https://github.com/lyusufdeniz/frix-teamspeak-bot">GitHub</a>
    </nav>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="tr">TR</button></div>
  </div>
</header>

<div class="layout">
  <aside class="side" id="side">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search docs" data-ph="search">
      <kbd>/</kbd>
      <div class="results" id="results" hidden></div>
    </div>
    <div id="pages"></div>
    <div class="foot">
      <a href="https://github.com/lyusufdeniz/frix-teamspeak-bot/issues" target="_blank" rel="noopener" data-t="side.issue">Report a problem</a>
      <a href="https://github.com/lyusufdeniz/frix-teamspeak-bot/releases/latest" target="_blank" rel="noopener" data-t="side.changes">Release notes</a>
    </div>
  </aside>
  <main>
    <article id="doc"><div class="loading">Loading…</div></article>
  </main>
  <aside class="toc" id="toc"></aside>
</div>
<div class="shade" id="shade"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(() => {
  // [id, English title, Turkish title, group]
  const PAGES = [
    ['introduction', 'Introduction', 'Giriş', 'start'],
    ['installation', 'Installation', 'Kurulum', 'start'],
    ['panel', 'Web panel', 'Web panel', 'guide'],
    ['plugins', 'Plugins', 'Eklentiler', 'guide'],
    ['commands', 'Commands', 'Komutlar', 'guide'],
    ['customization', 'Texts & commands', 'Metinler ve komutlar', 'guide'],
    ['scripts', 'Scripts', 'Scriptler', 'adv'],
    ['administration', 'Administration', 'Yönetim', 'adv'],
    ['troubleshooting', 'Troubleshooting', 'Sorun giderme', 'adv'],
  ];
  const GROUPS = { start: ['Getting started', 'Başlarken'], guide: ['Guide', 'Kılavuz'], adv: ['Advanced', 'İleri düzey'] };
  const T = {
    tr: { 'nav.home': 'Ana sayfa', 'nav.download': 'İndir', 'side.title': 'Dokümantasyon', 'side.issue': 'Sorun bildir',
      'side.source': 'Bu sayfayı GitHub\'da düzenle', 'side.changes': 'Sürüm notları', search: 'Dokümanlarda ara', noresult: 'Sonuç yok', prev: 'Önceki', next: 'Sonraki', onpage: 'Bu sayfada', copy: 'Kopyala', copied: 'Kopyalandı',
      loading: 'Yükleniyor…', fail: 'Sayfa yüklenemedi.', docs: 'Dokümantasyon' },
    en: { 'side.source': 'Edit this page on GitHub', search: 'Search docs', noresult: 'No results', prev: 'Previous', next: 'Next', onpage: 'On this page', copy: 'Copy', copied: 'Copied', loading: 'Loading…', fail: 'The page could not be loaded.', docs: 'Documentation' },
  };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
  const en = {};
  $$('[data-t]').forEach((e) => { en[e.dataset.t] = e.textContent; });
  let lang = 'en';
  try { lang = localStorage.getItem('frix.site.lang') || ((navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en'); } catch (_) { /* */ }
  const tr = (k) => (lang === 'tr' && T.tr[k] != null ? T.tr[k] : (T.en[k] != null ? T.en[k] : en[k]));
  const title = (p) => (lang === 'tr' ? p[2] : p[1]);
  const slug = (s) => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  let page = PAGES[0][0];
  const cache = {};

  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    const [p, anchor] = h.split(':');
    if (PAGES.some((x) => x[0] === p)) return { p, anchor };
    if (h && document.getElementById(h)) return { p: page, anchor: h };   // a heading in the current page
    return { p: page, anchor: null };
  }

  function paintNav() {
    const box = $('#pages');
    box.replaceChildren();
    Object.keys(GROUPS).forEach((g) => {
      const wrap = document.createElement('div'); wrap.className = 'grp';
      const h = document.createElement('h5'); h.textContent = GROUPS[g][lang === 'tr' ? 1 : 0]; wrap.append(h);
      PAGES.filter((p) => p[3] === g).forEach((p) => {
        const a = document.createElement('a'); a.className = 'pg' + (p[0] === page ? ' on' : ''); a.href = '#' + p[0]; a.textContent = title(p);
        wrap.append(a);
        if (p[0] === page) { const sub = document.createElement('div'); sub.className = 'sub'; sub.id = 'sub'; wrap.append(sub); }
      });
      box.append(wrap);
    });
  }
  // sections of the open page under its sidebar entry
  function paintSub() {
    const sub = $('#sub'); if (!sub) return;
    sub.replaceChildren(...$$('#doc h2').map((hh) => { const a = document.createElement('a'); a.href = '#' + page + ':' + hh.id; a.textContent = hh.textContent; a.dataset.id = hh.id; return a; }));
  }
  const closeDrawer = () => document.body.classList.remove('open');
  $('#menuBtn').addEventListener('click', () => document.body.classList.toggle('open'));
  $('#shade').addEventListener('click', closeDrawer);
  $('#side').addEventListener('click', (e) => { if (e.target.closest('a')) closeDrawer(); });

  // ---- search over every page of the current language
  const q = $('#q'), results = $('#results');
  let index = null, indexLang = null, sel = -1;
  async function buildIndex() {
    if (index && indexLang === lang) return index;
    const l = lang;
    const all = await Promise.all(PAGES.map(async (p) => {
      const key = l + '/' + p[0];
      if (cache[key] == null) { try { const r = await fetch('docs/' + key + '.md', { cache: 'no-cache' }); cache[key] = r.ok ? await r.text() : ''; } catch (_) { cache[key] = ''; } }
      const out = []; let head = null, id = null, buf = [];
      const used = {};
      const flush = () => { if (buf.length || head) out.push({ p, head, id, text: buf.join(' ').replace(/[`*_>#|\[\]()]/g, ' ').replace(/\s+/g, ' ').trim() }); buf = []; };
      cache[key].split('\n').forEach((line) => {
        const m = /^(#{2,3})\s+(.*)$/.exec(line);
        if (m) { flush(); head = m[2].replace(/[`*_]/g, ''); let sid = slug(head) || 'h'; if (used[sid]) sid += '-' + (++used[sid]); else used[sid] = 1; id = sid; }
        else if (!/^#\s/.test(line)) buf.push(line);
      });
      flush();
      return out;
    }));
    index = all.flat(); indexLang = l;
    return index;
  }
  const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function hl(text, words) {
    let h = esc(text);
    words.forEach((w) => { h = h.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); });
    return h;
  }
  async function search() {
    const term = q.value.trim().toLowerCase();
    if (term.length < 2) { results.hidden = true; return; }
    const words = term.split(/\s+/).filter(Boolean);
    const idx = await buildIndex();
    if (q.value.trim().toLowerCase() !== term) return;
    const hits = [];
    idx.forEach((e) => {
      const t = title(e.p).toLowerCase(), hd = (e.head || '').toLowerCase(), body = e.text.toLowerCase();
      if (!words.every((w) => t.includes(w) || hd.includes(w) || body.includes(w))) return;
      const score = words.reduce((n, w) => n + (hd.includes(w) ? 5 : 0) + (t.includes(w) ? 3 : 0) + (body.includes(w) ? 1 : 0), 0);
      let snip = '';
      const at = body.indexOf(words[0]);
      if (at >= 0) { const from = Math.max(0, at - 40); snip = (from ? '…' : '') + e.text.slice(from, at + 90) + '…'; }
      hits.push({ e, score, snip });
    });
    hits.sort((x, y) => y.score - x.score);
    sel = -1;
    results.replaceChildren();
    if (!hits.length) { const d = document.createElement('div'); d.className = 'none'; d.textContent = tr('noresult'); results.append(d); }
    hits.slice(0, 12).forEach((h) => {
      const a = document.createElement('a');
      a.href = '#' + h.e.p[0] + (h.e.id ? ':' + h.e.id : '');
      a.innerHTML = hl(h.e.head || title(h.e.p), words) + '<small>' + esc(title(h.e.p)) + (h.snip ? ' · ' + hl(h.snip, words) : '') + '</small>';
      a.addEventListener('click', () => { results.hidden = true; q.value = ''; });
      results.append(a);
    });
    results.hidden = false;
  }
  q.addEventListener('input', search);
  q.addEventListener('focus', search);
  q.addEventListener('keydown', (e) => {
    const items = $$('a', results);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!items.length) return;
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((a, k) => a.classList.toggle('sel', k === sel)); items[sel].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') { const a = items[sel < 0 ? 0 : sel]; if (a) { a.click(); location.hash = a.getAttribute('href'); } }
    else if (e.key === 'Escape') { results.hidden = true; q.blur(); }
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.search')) results.hidden = true; });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  });

  async function load(anchor) {
    const art = $('#doc');
    const key = lang + '/' + page;
    let md = cache[key];
    if (md == null) {
      art.innerHTML = '<div class="loading"></div>'; art.firstChild.textContent = tr('loading');
      try { const r = await fetch('docs/' + key + '.md', { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status); md = cache[key] = await r.text(); }
      catch (_) { art.innerHTML = '<div class="loading"></div>'; art.firstChild.textContent = tr('fail'); return; }
    }
    const i = PAGES.findIndex((x) => x[0] === page);
    art.innerHTML = '<div class="crumb"></div>' + marked.parse(md);
    art.firstChild.textContent = GROUPS[PAGES[i][3]][lang === 'tr' ? 1 : 0] + ' › ' + title(PAGES[i]);
    // heading ids, copy buttons, internal links
    const used = {};
    $$('h2, h3', art).forEach((hh) => { let id = slug(hh.textContent) || 'h'; if (used[id]) id += '-' + (++used[id]); else used[id] = 1; hh.id = id; });
    $$('pre', art).forEach((pre) => {
      const b = document.createElement('button'); b.className = 'copy'; b.type = 'button'; b.textContent = tr('copy');
      b.addEventListener('click', async () => { try { await navigator.clipboard.writeText(pre.querySelector('code').textContent); b.textContent = tr('copied'); setTimeout(() => { b.textContent = tr('copy'); }, 1400); } catch (_) { /* */ } });
      pre.append(b);
    });
    $$('a[href^="http"]', art).forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
    // previous / next
    const pager = document.createElement('div'); pager.className = 'pager';
    const mk = (p, cls, label) => { const a = document.createElement('a'); a.className = cls; a.href = '#' + p[0]; a.innerHTML = '<span></span><strong></strong>'; a.firstChild.textContent = label; a.lastChild.textContent = title(p); return a; };
    if (i > 0) pager.append(mk(PAGES[i - 1], 'prev', '← ' + tr('prev')));
    if (i < PAGES.length - 1) pager.append(mk(PAGES[i + 1], 'next', tr('next') + ' →'));
    const edit = document.createElement('div'); edit.className = 'edit';
    edit.innerHTML = '<a target="_blank" rel="noopener"></a><a target="_blank" rel="noopener" href="https://github.com/lyusufdeniz/frix-teamspeak-bot/issues"></a>';
    edit.children[0].href = 'https://github.com/lyusufdeniz/frix-teamspeak-bot/blob/main/site/docs/' + lang + '/' + page + '.md';
    edit.children[0].textContent = '✎ ' + tr('side.source'); edit.children[1].textContent = tr('side.issue');
    art.append(edit, pager);
    // on this page
    const toc = $('#toc');
    const h2s = $$('h2', art);
    toc.replaceChildren();
    if (h2s.length) {
      const hd = document.createElement('h4'); hd.textContent = tr('onpage'); toc.append(hd);
      h2s.forEach((hh) => { const a = document.createElement('a'); a.href = '#' + page + ':' + hh.id; a.textContent = hh.textContent; a.dataset.id = hh.id; toc.append(a); });
    }
    paintSub();
    document.title = title(PAGES[i]) + ' — Frix Docs';
    if (anchor && document.getElementById(anchor)) document.getElementById(anchor).scrollIntoView();
    else window.scrollTo(0, 0);
    spy();
  }

  function spy() {
    const h2s = $$('#doc h2');
    let cur = null;
    h2s.forEach((hh) => { if (hh.getBoundingClientRect().top < 140) cur = hh.id; });
    $$('#toc a, #sub a').forEach((a) => a.classList.toggle('on', a.dataset.id === cur));
  }

  function go() {
    const r = route();
    if (r.p !== page) { page = r.p; paintNav(); load(r.anchor); }
    else if (r.anchor && document.getElementById(r.anchor)) document.getElementById(r.anchor).scrollIntoView();
    else if (!r.anchor) { paintNav(); load(null); }
  }

  function applyLang() {
    document.documentElement.lang = lang;
    $$('[data-t]').forEach((e) => { e.textContent = tr(e.dataset.t); });
    q.placeholder = tr('search');
    $$('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
  }

  $$('.lang button').forEach((b) => b.addEventListener('click', () => {
    lang = b.dataset.lang; try { localStorage.setItem('frix.site.lang', lang); } catch (_) { /* */ }
    applyLang(); paintNav(); load(null);
  }));
  window.addEventListener('hashchange', go);
  window.addEventListener('scroll', spy, { passive: true });

  applyLang();
  const r = route();
  page = r.p;
  paintNav();
  load(r.anchor);
})();
</script>
</body>
</html>
